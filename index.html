<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Belanja</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #0002;
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        .item {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .total {
            background: #eff6ff;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .container {
                box-shadow: none;
            }

            button {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>INVOICE BELANJA</h1>
        <p id="tanggal"></p>

        <div id="hasil"></div>

        <button onclick="window.print()">
            Cetak Invoice / Simpan PDF
        </button>
    </div>

    <script src="script.js"></script>

</body>
</html>
